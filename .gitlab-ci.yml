stages:
  - build

build:
  stage: build
  image: node:20
  before_script:
    - npm config set registry https://registry.npmmirror.com
    # bloody thank u node
    # https://github.com/nodejs/corepack/issues/540
    - export COREPACK_NPM_REGISTRY=$(npm config get registry)
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install # install dependencies
    - pnpm build # build the project
    - cp server/config.toml.tmpl server/config.toml
    - cp -r server/ dist/deno
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  artifacts:
    paths:
      - dist/
